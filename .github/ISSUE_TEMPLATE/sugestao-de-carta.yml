name: Sugestão de par de cartas
description: Proponha duas frases novas para o baralho, uma de cada candidato, com as fontes.
title: "[Cartas] "
labels: ["sugestão de carta"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por sugerir cartas! Antes de enviar, leia as [regras de contribuição](https://github.com/gomesar9/baralho-do-posicionamento#regras).
        Para o baralho continuar equilibrado, cada sugestão traz **sempre duas cartas: uma do LULA e uma do FLÁVIO BOLSONARO**, de preferência sobre o mesmo tema. Um par por issue.

  - type: markdown
    attributes:
      value: "## Carta 1 — LULA"

  - type: textarea
    id: frase-lula
    attributes:
      label: Frase (LULA)
      description: |
        Como deve aparecer na carta: curta, fiel à fonte e sem pistas de quem disse ou defendeu (nada de nomes, partidos ou apelidos).
      placeholder: "Ex.: Garantir o aumento anual do salário mínimo acima da inflação."
    validations:
      required: true

  - type: input
    id: fonte-lula
    attributes:
      label: Link da fonte (LULA)
      description: Onde ele diz, propõe ou defende isso (vídeo, documento oficial, plano de governo, rede social oficial ou reportagem de veículo reconhecido).
      placeholder: "https://"
    validations:
      required: true

  - type: textarea
    id: contexto-lula
    attributes:
      label: Contexto da fonte (LULA)
      description: Data, ocasião e, se for vídeo, o minuto. Se a frase resume algo, cole o trecho original.
      placeholder: "Ex.: Entrevista à rádio X em 12/03/2026, aos 14:20: \"...\""
    validations:
      required: true

  - type: input
    id: hashtag-lula
    attributes:
      label: Tema (LULA)
      description: Prefira um tema que já existe no baralho (#economia, #saude, #seguranca, #educacao, #direitostrabalhistas...). Minúsculas e sem acento.
      placeholder: "#economia"
    validations:
      required: true

  - type: markdown
    attributes:
      value: "## Carta 2 — FLÁVIO BOLSONARO"

  - type: textarea
    id: frase-flavio
    attributes:
      label: Frase (FLÁVIO BOLSONARO)
      description: |
        Como deve aparecer na carta: curta, fiel à fonte e sem pistas de quem disse ou defendeu (nada de nomes, partidos ou apelidos).
      placeholder: "Ex.: Reduzir impostos sobre combustíveis."
    validations:
      required: true

  - type: input
    id: fonte-flavio
    attributes:
      label: Link da fonte (FLÁVIO BOLSONARO)
      description: Onde ele diz, propõe ou defende isso (vídeo, documento oficial, plano de governo, rede social oficial ou reportagem de veículo reconhecido).
      placeholder: "https://"
    validations:
      required: true

  - type: textarea
    id: contexto-flavio
    attributes:
      label: Contexto da fonte (FLÁVIO BOLSONARO)
      description: Data, ocasião e, se for vídeo, o minuto. Se a frase resume algo, cole o trecho original.
      placeholder: "Ex.: Entrevista à rádio X em 12/03/2026, aos 14:20: \"...\""
    validations:
      required: true

  - type: input
    id: hashtag-flavio
    attributes:
      label: Tema (FLÁVIO BOLSONARO)
      description: Prefira um tema que já existe no baralho e, se possível, o mesmo da carta 1. Minúsculas e sem acento.
      placeholder: "#economia"
    validations:
      required: true

  - type: checkboxes
    id: confirmacoes
    attributes:
      label: Confirmações
      options:
        - label: São duas cartas, uma de cada candidato.
          required: true
        - label: As duas fontes são verificáveis e mostram o próprio candidato dizendo, propondo ou defendendo aquilo.
          required: true
        - label: As frases são fiéis às fontes e não revelam de quem são.
          required: true
        - label: Verifiquei que não existem cartas iguais ou parecidas no baralho nem em outra issue aberta.
          required: true
